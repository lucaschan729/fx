  <!DOCTYPE html>
  <html lang="zh-Hant-HK">
  <head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AIA 保費匯率計算器</title>
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js" defer></script>
  <style>
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang HK","Microsoft JhengHei",sans-serif;background:#f2f5f9;color:#1c2b3a;line-height:1.5}
  header{background:linear-gradient(135deg,#1f3a5f,#2f5d8f);color:#fff;padding:22px 16px 18px;text-align:center}
  header h1{margin:0;font-size:22px;letter-spacing:1px}
  #status{margin-top:6px;font-size:13px;opacity:.9}
  main{max-width:640px;margin:0 auto;padding:14px}
  .card{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px rgba(31,58,95,.08)}
  .warn{background:#fff4d6;border:1px solid #e6b422;color:#7a5600;border-radius:12px;padding:10px 12px;margin-bottom:14px;font-size:14px;display:none}
  label{display:block;font-size:13px;color:#5b6b7c;margin-bottom:4px}
  select,input{width:100%;font-size:17px;padding:11px 12px;border:1px solid #cfd8e3;border-radius:10px;background:#fff;color:#1c2b3a}
  .swap{display:flex;justify-content:center;margin:8px 0}
  .swap button{width:44px;height:44px;border-radius:50%;border:none;background:#1f3a5f;color:#fff;font-size:20px}
  .result{margin-top:14px;background:#fbf3dc;border:1px solid #e6c766;border-radius:14px;padding:14px;text-align:center}
  .result .small{font-size:13px;color:#7a6a3a}
  .result .big{font-size:28px;font-weight:700;color:#1f3a5f;margin:4px 0;word-break:break-all}
  .btns{display:flex;gap:10px;margin-top:12px}
  .btns button{flex:1;padding:13px 8px;font-size:15px;border:none;border-radius:12px;font-weight:600}
  .b1{background:#1f3a5f;color:#fff}
  .b2{background:#c9a227;color:#fff}
  h2{font-size:16px;margin:0 0 10px;color:#1f3a5f}
  table{width:100%;border-collapse:collapse;font-size:15px}
  td{padding:10px 6px;border-bottom:1px solid #edf1f6}
  td.f{font-size:24px;width:40px;text-align:center}
  td.a{text-align:right;font-weight:600;white-space:nowrap}
  td .code{font-size:12px;color:#7b8a9a}
  tr.sel{background:#fbf3dc}
  tr.pol{color:#9aa7b5}
  tr.pol td.a{font-weight:400}
  details summary{font-weight:600;color:#1f3a5f;cursor:pointer}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
  .grid input{font-size:15px;padding:8px 10px}
  .link{background:none;border:none;color:#2f5d8f;font-size:14px;margin-top:10px;padding:0;text-decoration:underline}
  .note{font-size:12px;color:#6b7b8c}
  .note li{margin-bottom:4px}
  #toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#1c2b3a;color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none}
  </style>
  </head>
  <body>
  <header>
    <h1>AIA 保費匯率計算器</h1>
    <div id="status">載入匯率中…</div>
  </header>
  <main>
    <div class="warn" id="warn"></div>
    <div class="card">
      <label>保單貨幣</label>
      <select id="pol"></select>
      <div class="swap"><button id="swap" aria-label="對調">⇅</button></div>
      <label>繳付貨幣</label>
      <select id="pay"></select>
      <label style="margin-top:12px">保單貨幣金額</label>
      <input id="amt" type="text" inputmode="decimal" value="10,000">
      <div class="result">
        <div class="small" id="rTop"></div>
        <div class="big" id="rBig"></div>
        <div class="small" id="rRate"></div>
      </div>
      <div class="btns">
        <button class="b1" id="copy">複製結果</button>
        <button class="b2" id="xlsx">匯出 Excel 給客戶</button>
      </div>
    </div>
    <div class="card">
      <h2>各繳付貨幣應繳金額</h2>
      <table id="tbl"></table>
      <div class="note" style="margin-top:8px">點選任何一行可設為繳付貨幣。</div>
    </div>
    <div class="card">
      <details>
        <summary>手動輸入匯率（1 外幣兌港元）</summary>
        <div class="grid" id="manual"></div>
        <button class="link" id="reset">還原為自動匯率</button>
      </details>
    </div>
    <div class="card note">
      <ul style="margin:0;padding-left:18px">
        <li>匯率來自友邦香港網站公佈的外幣與港元兌換價，僅供參考。</li>
        <li>實際匯率以友邦收訖款項當日為準。</li>
        <li>非港元貨幣之間的金額，經港元匯率交叉計算。</li>
        <li>金額不包括保費徵費。</li>
      </ul>
    </div>
  </main>
  <div id="toast"></div>
  <script>
  const CUR = [
    {c:'HKD',n:'港元',s:'HK$',f:'🇭🇰'},
    {c:'USD',n:'美元',s:'US$',f:'🇺🇸'},
    {c:'CNY',n:'人民幣',s:'CN¥',f:'🇨🇳'},
    {c:'MOP',n:'澳門幣',s:'MOP$',f:'🇲🇴'},
    {c:'GBP',n:'英鎊',s:'£',f:'🇬🇧'},
    {c:'EUR',n:'歐羅',s:'€',f:'🇪🇺'},
    {c:'AUD',n:'澳元',s:'A$',f:'🇦🇺'},
    {c:'NZD',n:'紐西蘭元',s:'NZ$',f:'🇳🇿'},
    {c:'CAD',n:'加拿大元',s:'C$',f:'🇨🇦'},
    {c:'SGD',n:'新加坡元',s:'S$',f:'🇸🇬'},
    {c:'CHF',n:'瑞士法郎',s:'CHF',f:'🇨🇭'},
    {c:'JPY',n:'日圓',s:'JP¥',f:'🇯🇵'},
    {c:'TWD',n:'新台幣',s:'NT$',f:'🇹🇼'},
    {c:'PHP',n:'菲律賓披索',s:'₱',f:'🇵🇭'}
  ];
  const BUILTIN = {date:'2026-11-18', rates:{USD:7.8505,AUD:5.2819,CNY:1.1802,CAD:5.484,CHF:9.3398,GBP:10.3468,PHP:0.1232,MOP:0.9709,TWD:0.2381,SGD:6.0866,NZD:4.3094,EUR:8.6277,JPY:0.0492}};
  let S = {date:'', rates:{}, source:'', updated:''};
  const $ = id => document.getElementById(id);
  const info = c => CUR.find(x => x.c === c);
  const avail = () => CUR.filter(x => S.rates[x.c] > 0);
  const fmt = (n, d) => n.toLocaleString('en-US', {minimumFractionDigits:d, maximumFractionDigits:d});
  const money = (c, n) => info(c).s + ' ' + fmt(n, 2);
  const conv = (a, p, q) => a * S.rates[p] / S.rates[q];
  const hkToday = () => new Date(Date.now() + 8 * 3600e3).toISOString().slice(0, 10);
  const amount = () => { const v = parseFloat($('amt').value.replace(/,/g, '')); return v > 0 ? v : 0; };

  function toast(t){ const e = $('toast'); e.textContent = t; e.style.opacity = 1; setTimeout(() => e.style.opacity = 0, 2200); }

  function setRates(d, source){
    S = {date:d.date, rates:Object.assign({}, d.rates, {HKD:1}), source:source, updated:d.updated || ''};
  }

  async function load(){
    try {
      const r = await fetch('rates.json?t=' + Date.now(), {cache:'no-store'});
      if (!r.ok) throw new Error(r.status);
      const j = await r.json();
      if (!(j.rates && j.rates.USD > 7 && j.rates.USD < 9)) throw new Error('bad');
      setRates(j, '自動更新');
    } catch (e) {
      setRates(BUILTIN, '內置');
    }
    build();
  }

  function build(){
    const keepP = $('pol').value || 'USD', keepQ = $('pay').value || 'HKD';
    const opts = avail().map(x => '<option value="' + x.c + '">' + x.f + ' ' + x.n + ' ' + x.c + '（' + x.s + '）</option>').join('');
    $('pol').innerHTML = opts; $('pay').innerHTML = opts;
    $('pol').value = S.rates[keepP] ? keepP : 'USD';
    $('pay').value = S.rates[keepQ] ? keepQ : 'HKD';
    $('manual').innerHTML = CUR.filter(x => x.c !== 'HKD').map(x =>
      '<div><label>' + x.f + ' ' + x.n + ' ' + x.c + '</label><input type="text" inputmode="decimal" data-c="' + x.c + '" value="' + (S.rates[x.c] || '') + '"></div>').join('');
    render();
  }

  function render(){
    const p = $('pol').value, q = $('pay').value, a = amount();
    $('status').textContent = '友邦匯率日期：' + S.date + '（' + S.source + '）' + (S.updated && S.source === '自動更新' ? '　更新於 ' + S.updated.slice(11) : '');
    const w = $('warn'), msgs = [];
    if (S.source === '手動') msgs.push('⚠️ 正在使用手動輸入的匯率，請核對後才發給客戶。');
    else if (S.date !== hkToday()) msgs.push('⚠️ 匯率日期（' + S.date + '）不是今天，友邦可能尚未公佈今天匯率，或自動更新未完成。');
    w.style.display = msgs.length ? 'block' : 'none'; w.textContent = msgs.join(' ');
    const P = info(p), Q = info(q), out = conv(a, p, q);
    $('rTop').textContent = P.f + ' ' + P.n + ' ' + money(p, a) + ' 　→　 ' + Q.f + ' ' + Q.n;
    $('rBig').textContent = money(q, out);
    $('rRate').textContent = '1 ' + P.n + ' = ' + fmt(conv(1, p, q), 4) + ' ' + Q.n + (p !== 'HKD' && q !== 'HKD' && p !== q ? '（交叉計算，僅供參考）' : '');
    $('tbl').innerHTML = avail().map(x =>
      '<tr data-c="' + x.c + '" class="' + (x.c === q ? 'sel' : '') + (x.c === p ? ' pol' : '') + '"><td class="f">' + x.f + '</td><td>' + x.n +
      (x.c === p ? '（保單貨幣）' : '') + '<div class="code">' + x.c + '</div></td><td class="a">' + money(x.c, conv(a, p, x.c)) + '</td></tr>').join('');
  }

  function copyText(){
    const p = $('pol').value, q = $('pay').value, a = amount(), P = info(p), Q = info(q);
    const lines = [
      '保單貨幣金額：' + P.f + ' ' + P.n + ' ' + money(p, a),
      '繳付貨幣金額：' + Q.f + ' ' + Q.n + ' ' + money(q, conv(a, p, q)),
      '匯率：1 ' + P.n + ' = ' + fmt(conv(1, p, q), 4) + ' ' + Q.n,
      '匯率日期：' + S.date + '（友邦香港' + (S.source === '手動' ? '，手動輸入' : '') + '）',
      '＊實際匯率以友邦收訖款項當日為準；金額不包括保費徵費。'
    ];
    const t = lines.join('\n');
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(t).then(() => toast('已複製'), () => fallbackCopy(t));
    } else fallbackCopy(t);
  }
  function fallbackCopy(t){
    const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('已複製'); } catch (e) { toast('複製失敗，請手動選取'); }
    ta.remove();
  }

  async function exportXlsx(){
    if (!window.ExcelJS) { toast('Excel 工具尚未載入，請檢查網絡後再試'); return; }
    const p = $('pol').value, a = amount(), P = info(p);
    if (!a) { toast('請先輸入金額'); return; }
    const NAVY = 'FF1F3A5F', GOLD = 'FFFBF0CC', GOLDL = 'FFC9A227', ZEBRA = 'FFF4F7FB', GREY = 'FF6B7B8C';
    const fill = c => ({type:'pattern', pattern:'solid', fgColor:{argb:c}});
    const FONT = 'Microsoft JhengHei';
    const wb = new ExcelJS.Workbook();
    const ws = wb.addWorksheet('貨幣對照', {views:[{showGridLines:false}],
      pageSetup:{paperSize:9, orientation:'portrait', fitToPage:true, fitToWidth:1, fitToHeight:1, horizontalCentered:true}});
    ws.columns = [{width:3},{width:7},{width:24},{width:10},{width:26},{width:20},{width:3}];
    ws.getRow(1).height = 8;

    ws.mergeCells('B2:F2');
    let c = ws.getCell('B2'); c.value = '保費繳付貨幣對照表';
    c.font = {name:FONT, size:20, bold:true, color:{argb:'FFFFFFFF'}}; c.fill = fill(NAVY);
    c.alignment = {horizontal:'center', vertical:'middle'}; ws.getRow(2).height = 42;
    ws.mergeCells('B3:F3');
    c = ws.getCell('B3'); c.value = '匯率日期：' + S.date + '　｜　資料來源：友邦香港公佈匯率' + (S.source === '手動' ? '（手動輸入）' : '');
    c.font = {name:FONT, size:10, color:{argb:'FFE6ECF4'}}; c.fill = fill(NAVY);
    c.alignment = {horizontal:'center', vertical:'middle'}; ws.getRow(3).height = 22;
    ws.getRow(4).height = 10;

    ws.mergeCells('B5:F5');
    c = ws.getCell('B5'); c.value = '保單貨幣金額';
    c.font = {name:FONT, size:10, color:{argb:'FF7A6A3A'}}; c.fill = fill(GOLD);
    c.alignment = {horizontal:'center', vertical:'bottom'}; ws.getRow(5).height = 20;
    ws.mergeCells('B6:F6');
    c = ws.getCell('B6'); c.value = P.f + '  ' + P.n + '  ' + money(p, a);
    c.font = {name:FONT, size:22, bold:true, color:{argb:NAVY}}; c.fill = fill(GOLD);
    c.alignment = {horizontal:'center', vertical:'middle'}; ws.getRow(6).height = 40;
    c.border = {bottom:{style:'medium', color:{argb:GOLDL}}};
    ws.getRow(7).height = 10;

    const heads = ['', '繳付貨幣', '代號', '應繳金額', '匯率（1 單位兌港元）'];
    heads.forEach((h, i) => {
      const cell = ws.getRow(8).getCell(i + 2); cell.value = h;
      cell.font = {name:FONT, size:11, bold:true, color:{argb:'FFFFFFFF'}}; cell.fill = fill(NAVY);
      cell.alignment = {horizontal: i >= 3 ? 'right' : (i === 1 ? 'left' : 'center'), vertical:'middle'};
    });
    ws.getRow(8).height = 26;

    let r = 9;
    avail().forEach((x, k) => {
      const row = ws.getRow(r), isPol = x.c === p;
      const vals = [x.f, x.n + (isPol ? '（保單貨幣）' : ''), x.c, Math.round(conv(a, p, x.c) * 100) / 100, S.rates[x.c]];
      vals.forEach((v, i) => {
        const cell = row.getCell(i + 2); cell.value = v;
        cell.font = {name:FONT, size: i === 0 ? 14 : (i === 3 ? 12 : 11), bold: isPol || i === 3, color:{argb: i === 4 ? GREY : 'FF1C2B3A'}};
        cell.alignment = {horizontal: i >= 3 ? 'right' : (i === 1 ? 'left' : 'center'), vertical:'middle'};
        cell.border = {bottom:{style:'thin', color:{argb:'FFDDE4EC'}}};
        if (isPol) cell.fill = fill(GOLD); else if (k % 2 === 1) cell.fill = fill(ZEBRA);
        if (i === 3) cell.numFmt = '"' + x.s + ' "#,##0.00';
        if (i === 4) cell.numFmt = '0.0000';
      });
      row.height = 26; r++;
    });

    ws.getRow(r).height = 10; r++;
    const notes = [
      '備註',
      '1. 以上金額按友邦香港於 ' + S.date + ' 公佈之匯率計算，僅供參考。',
      '2. 實際匯率以友邦收訖款項當日之匯率為準，實際應繳金額或會有所不同。',
      '3. 港元以外貨幣之間的金額，經港元匯率換算。',
      '4. 以上金額並不包括保費徵費。'
    ];
    notes.forEach((t, i) => {
      ws.mergeCells('B' + r + ':F' + r);
      const cell = ws.getCell('B' + r); cell.value = t;
      cell.font = {name:FONT, size:9, bold: i === 0, color:{argb:GREY}};
      cell.alignment = {horizontal:'left', vertical:'middle', wrapText:true};
      ws.getRow(r).height = 18; r++;
    });
    ws.pageSetup.printArea = 'A1:G' + r;

    const buf = await wb.xlsx.writeBuffer();
    const type = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
    const name = '保費貨幣對照_' + p + '_' + Math.round(a) + '_' + S.date + '.xlsx';
    const blob = new Blob([buf], {type:type});
    try {
      const file = new File([blob], name, {type:type});
      if (navigator.canShare && navigator.canShare({files:[file]})) {
        await navigator.share({files:[file]});
        return;
      }
    } catch (e) {
      if (e && e.name === 'AbortError') return;
    }
    const url = URL.createObjectURL(blob), link = document.createElement('a');
    link.href = url; link.download = name; document.body.appendChild(link); link.click(); link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    toast('已下載 Excel');
  }

  $('pol').addEventListener('change', render);
  $('pay').addEventListener('change', render);
  $('amt').addEventListener('input', render);
  $('amt').addEventListener('blur', () => { const a = amount(); if (a) $('amt').value = fmt(a, 2).replace(/\.00$/, ''); });
  $('swap').addEventListener('click', () => { const p = $('pol').value; $('pol').value = $('pay').value; $('pay').value = p; render(); });
  $('copy').addEventListener('click', copyText);
  $('xlsx').addEventListener('click', () => exportXlsx().catch(e => toast('匯出失敗：' + e.message)));
  $('tbl').addEventListener('click', e => { const tr = e.target.closest('tr'); if (tr) { $('pay').value = tr.dataset.c; render(); window.scrollTo({top:0, behavior:'smooth'}); } });
  $('manual').addEventListener('input', e => {
    const c = e.target.dataset.c, v = parseFloat(e.target.value);
    if (c && v > 0) { S.rates[c] = v; S.source = '手動'; render(); }
  });
  $('reset').addEventListener('click', () => { load(); toast('已還原'); });
  load();
  </script>
  </body>
  </html>
